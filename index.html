function getProgressStars(n) {

const star = 5 - cyclePos;
return '☆'.repeat(hollow) + '★'.repeat(star);
} else {
const star = cyclePos - 5;
const hollow = 10 - cyclePos;

}

// メインアプリコンポーネント
function KanjiLearningApp() {
const [screen, setScreen] = useState('level'); // 'level', 'type', 'menu', 'question', 'answer', 'review'
const [level, setLevel] = useState(null); // 'jun2' | '2kyu'
const [type, setType] = useState(null); // 'yomi' | 'bushu' | ...
const [selectedSet, setSelectedSet] = useState(0);
const [currentIndex, setCurrentIndex] = useState(0);
const [checkedItems, setCheckedItems] = useState({});
const [reviewData, setReviewData] = useState([]);
const [setCompletions, setSetCompletions] = useState({});

useEffect(() => {
const saved = localStorage.getItem('kanjiCheckedItems');
if (saved) {
setCheckedItems(JSON.parse(saved));
}
const savedCompletions = localStorage.getItem('kanjiSetCompletions');
if (savedCompletions) {
setSetCompletions(JSON.parse(savedCompletions));
}
}, []);

useEffect(() => {
localStorage.setItem('kanjiCheckedItems', JSON.stringify(checkedItems));
}, [checkedItems]);

useEffect(() => {
localStorage.setItem('kanjiSetCompletions', JSON.stringify(setCompletions));
}, [setCompletions]);

const currentLevelInfo = LEVELS.find(l => l.key === level);
const currentTypeInfo = currentLevelInfo ? currentLevelInfo.types.find(t => t.key === type) : null;
const currentData = currentTypeInfo ? currentTypeInfo.data : [];
const categoryKey = `${level}_${type}`;
const buildKey = (id) => `${categoryKey}_item_${id}`;

const handleSelectLevel = (levelKey) => {
setLevel(levelKey);
setType(null);
setScreen('type');
};

const handleSelectType = (typeKey) => {
setType(typeKey);
setSelectedSet(0);
setCurrentIndex(0);
setScreen('menu');
};

const handleSelectSet = (setNumber) => {
setSelectedSet(setNumber);
setCurrentIndex(0);
setScreen('question');
};

const handleReview = () => {
const checked = currentData.filter(item => checkedItems[buildKey(item.id)]);
setReviewData(checked);
setCurrentIndex(0);
setScreen('review');
};

const handleNext = () => {
if (screen === 'question') {
setScreen('answer');
} else if (screen === 'answer') {
const setStartIndex = selectedSet * 20;
const setEndIndex = Math.min((selectedSet + 1) * 20, currentData.length);
const currentSetData = currentData.slice(setStartIndex, setEndIndex);
if (currentIndex + 1 < currentSetData.length) {
setCurrentIndex(currentIndex + 1);
setScreen('question');
} else {
// セット完了：★進捗を記録し、次のセットへ（なければメニューへ）
const completionKey = `${categoryKey}_set_${selectedSet}`;
setSetCompletions(prev => ({
...prev,
[completionKey]: (prev[completionKey] || 0) + 1
}));
const totalSets = Math.ceil(currentData.length / 20);
if (selectedSet + 1 < totalSets) {
setSelectedSet(selectedSet + 1);
setCurrentIndex(0);
setScreen('question');
} else {
setScreen('menu');
setCurrentIndex(0);
}
}
} else if (screen === 'review') {
if (currentIndex + 1 < reviewData.length) {
setCurrentIndex(currentIndex + 1);
} else {
setScreen('menu');
}
}
};

const handlePrev = () => {
if (currentIndex > 0) {
setCurrentIndex(currentIndex - 1);
setScreen('question');
}
};

const handleToggleCheck = () => {
let currentItem;
if (screen === 'review') {
currentItem = reviewData[currentIndex];
} else {
const setStartIndex = selectedSet * 20;
const currentSetData = currentData.slice(setStartIndex, Math.min((selectedSet + 1) * 20, currentData.length));
currentItem = currentSetData[currentIndex];
}
if (currentItem) {
const key = buildKey(currentItem.id);
setCheckedItems(prev => ({
...prev,
[key]: !prev[key]
}));
}
};

const handleBackToMenu = () => {
setScreen('menu');
setCurrentIndex(0);
};

const handleBackToType = () => {
setScreen('type');
setType(null);
setSelectedSet(0);
setCurrentIndex(0);
};

const handleBackToLevel = () => {
setScreen('level');
setLevel(null);
setType(null);
setSelectedSet(0);
setCurrentIndex(0);
};

const checkedCount = type
? currentData.filter(item => checkedItems[buildKey(item.id)]).length
: 0;

const setStartIndex = selectedSet * 20;
const currentSetData = currentData.slice(setStartIndex, Math.min((selectedSet + 1) * 20, currentData.length));
const currentItem = screen === 'review' ? reviewData[currentIndex] : currentSetData[currentIndex];
const currentItemKey = currentItem ? buildKey(currentItem.id) : null;
const isChecked = currentItemKey ? !!checkedItems[currentItemKey] : false;

if (screen === 'level') {
return <LevelScreen onSelectLevel={handleSelectLevel} />;
} else if (screen === 'type') {
return <TypeScreen level={currentLevelInfo} onSelectType={handleSelectType} onBackToLevel={handleBackToLevel} />;
} else if (screen === 'menu') {
return <MenuScreen
data={currentData}
categoryLabel={`${currentLevelInfo.label}　${currentTypeInfo.label}`}
categoryKey={categoryKey}
setCompletions={setCompletions}
onSelectSet={handleSelectSet}
onReview={handleReview}
onBackToType={handleBackToType}
checkedCount={checkedCount}
/>;
} else if (screen === 'question') {
return <QuestionScreen
data={currentData}
categoryLabel={`${currentLevelInfo.label}　${currentTypeInfo.label}`}
mode={currentTypeInfo.mode}
setNumber={selectedSet}
currentIndex={currentIndex}
onNext={handleNext}
onPrev={handlePrev}
onBackToMenu={handleBackToMenu}
isChecked={isChecked}
onToggleCheck={handleToggleCheck}
/>;
} else if (screen === 'answer') {
return <AnswerScreen
data={currentData}
categoryLabel={`${currentLevelInfo.label}　${currentTypeInfo.label}`}
mode={currentTypeInfo.mode}
setNumber={selectedSet}
currentIndex={currentIndex}
onNext={handleNext}
onPrev={handlePrev}
onBackToMenu={handleBackToMenu}
isChecked={isChecked}
onToggleCheck={handleToggleCheck}
/>;
} else if (screen === 'review') {
return <ReviewScreen
currentIndex={currentIndex}
reviewData={reviewData}
onNext={handleNext}
onBackToMenu={handleBackToMenu}
checkedItems={checkedItems}
onToggleCheck={handleToggleCheck}
buildKey={buildKey}
mode={currentTypeInfo.mode}
/>;
}
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KanjiLearningApp />);
</script>
</body>
</html>
