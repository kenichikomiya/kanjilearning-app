const sets = [];

const start = i * 20 + 1;
const end = Math.min((i + 1) * 20, data.length);
sets.push({ number: i + 1, start, end });
}

return (
<div className="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-4 pt-8 flex flex-col">
<div className="text-center mb-8">
<h1 className="text-3xl font-bold text-gray-800 mb-2">漢字検定</h1>
<p className="text-gray-600">{categoryLabel}</p>
</div>

{checkedCount > 0 && (
<button
onClick={onReview}
className="w-full bg-orange-500 text-white rounded-lg shadow-md p-4 mb-4 font-bold hover:bg-orange-600 transition-all"
>
復習する ({checkedCount} 問)
</button>
)}

<div className="flex-1 flex flex-col gap-3 mb-4">
{sets.map(set => (
<button
key={set.number}
onClick={() => onSelectSet(set.number - 1)}
className="w-full bg-white rounded-lg shadow-md p-6 text-left hover:shadow-lg transition-shadow"
>
<div className="flex items-center justify-between">
<div>
<p className="text-lg font-bold text-blue-600">

<p className="text-sm text-gray-600">

// 復習画面コンポーネント

// メインアプリコンポーネント
function KanjiLearningApp() {
const [screen, setScreen] = useState('category'); // 'category', 'menu', 'question', 'answer', 'review'
const [category, setCategory] = useState(null); // 'kokugo' | 'yoji'
const [selectedSet, setSelectedSet] = useState(0);
const [currentIndex, setCurrentIndex] = useState(0);
const [checkedItems, setCheckedItems] = useState({});
const [reviewData, setReviewData] = useState([]);

useEffect(() => {
const saved = localStorage.getItem('kanjiCheckedItems');
if (saved) {
setCheckedItems(JSON.parse(saved));
}
}, []);

useEffect(() => {
localStorage.setItem('kanjiCheckedItems', JSON.stringify(checkedItems));
}, [checkedItems]);

const currentCategoryInfo = CATEGORIES.find(c => c.key === category);
const currentData = currentCategoryInfo ? currentCategoryInfo.data : [];
const buildKey = (id) => `${category}_item_${id}`;

const handleSelectCategory = (catKey) => {
setCategory(catKey);
setSelectedSet(0);
setCurrentIndex(0);
setScreen('menu');
};

const handleSelectSet = (setNumber) => {
setSelectedSet(setNumber);
setCurrentIndex(0);
setScreen('question');
};

const handleReview = () => {
const checked = currentData.filter(item => checkedItems[buildKey(item.id)]);
setReviewData(checked);
setCurrentIndex(0);
setScreen('review');
};

const handleNext = () => {
if (screen === 'question') {
setScreen('answer');
} else if (screen === 'answer') {
const setStartIndex = selectedSet * 20;
const setEndIndex = Math.min((selectedSet + 1) * 20, currentData.length);
const currentSetData = currentData.slice(setStartIndex, setEndIndex);
if (currentIndex + 1 < currentSetData.length) {
setCurrentIndex(currentIndex + 1);
setScreen('question');
} else {
setScreen('question');
}
} else if (screen === 'review') {
if (currentIndex + 1 < reviewData.length) {
setCurrentIndex(currentIndex + 1);
} else {
setScreen('menu');
}
}
};

const handleToggleCheck = () => {
let currentItem;
if (screen === 'review') {
currentItem = reviewData[currentIndex];
} else {
const setStartIndex = selectedSet * 20;
const currentSetData = currentData.slice(setStartIndex, Math.min((selectedSet + 1) * 20, currentData.length));
currentItem = currentSetData[currentIndex];
}
if (currentItem) {
const key = buildKey(currentItem.id);
setCheckedItems(prev => ({
...prev,
[key]: !prev[key]
}));
}
};

const handleBackToMenu = () => {
setScreen('menu');
setCurrentIndex(0);
};

const handleBackToCategory = () => {
setScreen('category');
setCategory(null);
setSelectedSet(0);
setCurrentIndex(0);
};

const checkedCount = category
? currentData.filter(item => checkedItems[buildKey(item.id)]).length
: 0;

const setStartIndex = selectedSet * 20;
const currentSetData = currentData.slice(setStartIndex, Math.min((selectedSet + 1) * 20, currentData.length));
const currentItem = screen === 'review' ? reviewData[currentIndex] : currentSetData[currentIndex];
const currentItemKey = currentItem ? buildKey(currentItem.id) : null;
const isChecked = currentItemKey ? !!checkedItems[currentItemKey] : false;

if (screen === 'category') {
return <CategoryScreen onSelectCategory={handleSelectCategory} />;
} else if (screen === 'menu') {
return <MenuScreen
data={currentData}
categoryLabel={currentCategoryInfo.label}
onSelectSet={handleSelectSet}
onReview={handleReview}
onBackToCategory={handleBackToCategory}
checkedCount={checkedCount}
/>;
} else if (screen === 'question') {
return <QuestionScreen
data={currentData}
categoryLabel={currentCategoryInfo.label}
setNumber={selectedSet}
currentIndex={currentIndex}
onNext={handleNext}
onBackToMenu={handleBackToMenu}
isChecked={isChecked}
onToggleCheck={handleToggleCheck}
/>;
} else if (screen === 'answer') {
return <AnswerScreen
data={currentData}
categoryLabel={currentCategoryInfo.label}
setNumber={selectedSet}
currentIndex={currentIndex}
onNext={handleNext}
onBackToMenu={handleBackToMenu}
isChecked={isChecked}
onToggleCheck={handleToggleCheck}
/>;
} else if (screen === 'review') {
return <ReviewScreen
currentIndex={currentIndex}
reviewData={reviewData}
onNext={handleNext}
onBackToMenu={handleBackToMenu}
checkedItems={checkedItems}
onToggleCheck={handleToggleCheck}
buildKey={buildKey}
/>;
}
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KanjiLearningApp />);
</script>
</body>
</html>
