// セット完了回数から★/☆表示を計算する
// 1〜5回目: ★を1個ずつ増やす。6〜10回目: 前から☆に変えていく。
// 11〜15回目: 前から★に戻す。以降10回周期で繰り返す。
function getProgressStars(n) {
if (!n || n <= 0) return '';
if (n <= 5) return '★'.repeat(n);
const k = n - 5;
const cyclePos = ((k - 1) % 10) + 1;
if (cyclePos <= 5) {
const hollow = cyclePos;
const star = 5 - cyclePos;
return '☆'.repeat(hollow) + '★'.repeat(star);
} else {
const star = cyclePos - 5;
const hollow = 10 - cyclePos;
return '★'.repeat(star) + '☆'.repeat(hollow);
}
}

<div className="w-full max-w-sm mx-auto mb-16 flex gap-2">
<button
onClick={onNext}
style={{ width: currentIndex > 0 ? '80%' : '100%' }}
className="py-4 rounded-lg font-bold text-white text-lg bg-blue-500 shadow-md hover:bg-blue-600 active:scale-95 transition-all"
>
次へ
</button>
{currentIndex > 0 && (
<button
onClick={onPrev}
style={{ width: '20%' }}
className="py-4 rounded-lg font-bold text-white text-base bg-gray-400 shadow-md hover:bg-gray-500 active:scale-95 transition-all"
>
前へ
</button>
)}
</div>

<label className="flex gap-3 items-center w-full max-w-sm mx-auto mb-6 cursor-pointer">
<input
type="checkbox"
checked={isChecked}
onChange={onToggleCheck}
className="w-6 h-6 cursor-pointer"
/>
<span className="text-sm text-gray-700">わからなかった</span>
</label>

<div className="text-center mb-4">
<button
onClick={onBackToMenu}
className="text-blue-600 hover:text-blue-800 font-semibold text-sm underline"
>
← メニューに戻る
</button>
</div>
</div>
);
}

// 解答画面コンポーネント
function AnswerScreen({ data, categoryLabel, mode, setNumber, currentIndex, onNext, onPrev, onBackToMenu, isChecked, onToggleCheck }) {
const setStartIndex = setNumber * 20;
const setEndIndex = Math.min((setNumber + 1) * 20, data.length);
const currentSetData = data.slice(setStartIndex, setEndIndex);
const currentItem = currentSetData[currentIndex];
const isLastInSet = currentIndex + 1 >= currentSetData.length;

if (!currentItem) {
return (
<div className="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-4 pt-8 flex flex-col">
<div className="flex-1 flex flex-col items-center justify-center gap-4">
<p className="text-xl text-gray-800 font-bold">
セット {setNumber + 1} が完了しました！
</p>
<button
onClick={onBackToMenu}
className="bg-blue-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-600"
>
メニューに戻る
</button>
</div>
</div>
);
}

const renderSentence = (item) => {
const idx = item.sentence.indexOf(item.target);
if (idx === -1) {
return <span>{item.sentence}</span>;
}
const before = item.sentence.slice(0, idx);
const after = item.sentence.slice(idx + item.target.length);
return (
<span>
{before}
<span className="underline decoration-2 underline-offset-4 text-green-700">{item.target}</span>
{after}
</span>
);
};

return (
<div className="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 p-4 pt-12 flex flex-col">
<div className="text-center mb-6">
<h1 className="text-2xl font-bold text-gray-800">漢字検定（{categoryLabel}）</h1>
<p className="text-sm text-gray-600">
セット {setNumber + 1} / 問題 {currentIndex + 1}/{currentSetData.length}
</p>
</div>

<div className="w-full max-w-sm mx-auto mb-12">
<div className="bg-gradient-to-br from-green-100 to-green-50 rounded-lg shadow-lg p-8 mb-4 min-h-[350px] flex flex-col justify-center">
<div className="text-center">
{mode === 'sentence' ? (
<p className="text-lg font-bold text-gray-800 leading-relaxed mb-4">
{renderSentence(currentItem)}
</p>
) : mode === 'dousei' ? (
<p className="text-lg font-bold text-gray-800 leading-relaxed mb-4">
{currentItem.correctedSentence}
</p>
) : mode === 'okurigana' ? (
<p className="text-lg font-bold text-gray-800 leading-relaxed mb-4">
{currentItem.correctedSentence}
</p>
) : mode === 'kakitori' ? (
<p className="text-lg font-bold text-gray-800 leading-relaxed mb-4">
{currentItem.correctedSentence}
</p>
) : mode === 'kouzou' ? (
<p className="text-4xl font-bold text-green-600 mb-4">
{currentItem.jukugo}
</p>
) : mode === 'yoji' ? (
<p className="text-5xl font-bold text-green-600 mb-4 tracking-wider">
{currentItem.answer}
</p>
) : (
<p className="text-4xl font-bold text-green-600 mb-4">
{mode === 'taigirui' ? currentItem.word : mode === 'goji' ? currentItem.wrong : currentItem.kanji}
</p>
)}
<div className="border-t-2 border-green-300 pt-6 mt-6">
{mode === 'bushu' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【部首】</p>
<p className="text-5xl font-bold text-green-700 mb-4">
{currentItem.bushu}
</p>
<p className="text-gray-700 text-sm mb-2">【部首名】</p>
<p className="text-xl text-gray-800 mb-4">
{currentItem.bushuYomi}
</p>
{currentItem.examples && currentItem.examples.length > 0 && (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【同じ部首の漢字】</p>
<p className="text-2xl text-gray-800">
{currentItem.examples.join('　')}
</p>
</React.Fragment>
)}
</React.Fragment>
) : mode === 'taigirui' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【{currentItem.kind}】</p>
<p className="text-4xl font-bold text-green-700 mb-4">
{currentItem.answer}
</p>
<p className="text-gray-700 text-sm mb-2">【読み】</p>
<p className="text-xl text-gray-800 mb-4">
{currentItem.answerYomi}
</p>
<p className="text-gray-700 text-sm mb-2">【問題の語句の読み】</p>
<p className="text-xl text-gray-800">
{currentItem.word}（{currentItem.wordYomi}）
</p>
</React.Fragment>
) : mode === 'dousei' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【正しい語句】</p>
<p className="text-3xl font-bold text-green-700 mb-4">
{currentItem.word}
</p>
<p className="text-gray-700 text-sm mb-2">【意味】</p>
<p className="text-base text-gray-800 leading-relaxed">
{currentItem.imi}
</p>
</React.Fragment>
) : mode === 'goji' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【正字】</p>
<p className="text-5xl font-bold text-green-700 mb-4">
{currentItem.correct}
</p>
<p className="text-gray-700 text-sm mb-2">【正しい語句・読み】</p>
<p className="text-xl text-gray-800">
{currentItem.word}（{currentItem.reading}）
</p>
</React.Fragment>
) : mode === 'okurigana' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【正しい語句】</p>
<p className="text-4xl font-bold text-green-700 mb-4">
{currentItem.answer}
</p>
</React.Fragment>
) : mode === 'kakitori' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【正しい語句】</p>
<p className="text-4xl font-bold text-green-700 mb-4">
{currentItem.answer}
</p>
<p className="text-gray-700 text-sm mb-2">【意味】</p>
<p className="text-base text-gray-800 leading-relaxed">
{currentItem.meaning}
</p>
</React.Fragment>
) : mode === 'kouzou' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【答え】</p>
<p className="text-5xl font-bold text-green-700 mb-4">
{currentItem.answer}
</p>
<p className="text-gray-700 text-sm mb-2">【読み】</p>
<p className="text-xl text-gray-800 mb-4">
{currentItem.reading}
</p>
<p className="text-gray-700 text-sm mb-2">【解説】</p>
<p className="text-base text-gray-800 leading-relaxed">
{currentItem.explanation}
</p>
</React.Fragment>
) : mode === 'yoji' ? (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【読み】</p>
<p className="text-2xl font-semibold text-green-700 mb-6">
{currentItem.reading}
</p>
<p className="text-gray-700 text-sm mb-2">【意味】</p>
<p className="text-base text-gray-800 leading-relaxed">
{currentItem.meaning}
</p>
</React.Fragment>
) : (
<React.Fragment>
<p className="text-gray-700 text-sm mb-2">【読み方】</p>
<p className="text-2xl font-semibold text-green-700 mb-6">
{currentItem.yomi}
</p>
<p className="text-gray-700 text-sm mb-2">【意味】</p>
<p className="text-base text-gray-800 leading-relaxed">
{currentItem.imi}
</p>
</React.Fragment>
)}
</div>
</div>
</div>

<div className="bg-gray-200 rounded-full h-2">
<div
className="bg-blue-500 h-2 rounded-full transition-all"
style={{
width: `${((currentIndex + 1) / currentSetData.length) * 100}%`,
}}
></div>
</div>
</div>

<div className="w-full max-w-sm mx-auto mb-16 flex gap-2">
<button
onClick={onNext}
style={{ width: currentIndex > 0 ? '80%' : '100%' }}
className="py-4 rounded-lg font-bold text-white text-lg bg-blue-500 shadow-md hover:bg-blue-600 active:scale-95 transition-all"
>
{isLastInSet ? '次のセットへ' : '次へ'}
</button>
{currentIndex > 0 && (
<button
onClick={onPrev}
style={{ width: '20%' }}
className="py-4 rounded-lg font-bold text-white text-base bg-gray-400 shadow-md hover:bg-gray-500 active:scale-95 transition-all"
>
前へ
</button>
)}
</div>

<label className="flex gap-3 items-center w-full max-w-sm mx-auto mb-6 cursor-pointer">
<input
type="checkbox"
checked={isChecked}
onChange={onToggleCheck}
className="w-6 h-6 cursor-pointer"
/>
<span className="text-sm text-gray-700">わからなかった</span>
</label>

<div className="text-center mb-4">
<button
onClick={onBackToMenu}
className="text-blue-600 hover:text-blue-800 font-semibold text-sm underline"
>
← メニューに戻る
</button>
</div>
</div>
);
}

// メインアプリコンポーネント
function KanjiLearningApp() {
const [screen, setScreen] = useState('level'); // 'level', 'type', 'menu', 'question', 'answer', 'review'
const [level, setLevel] = useState(null); // 'jun2' | '2kyu'
const [type, setType] = useState(null); // 'yomi' | 'bushu' | ...
const [selectedSet, setSelectedSet] = useState(0);
const [currentIndex, setCurrentIndex] = useState(0);
const [checkedItems, setCheckedItems] = useState({});
const [reviewData, setReviewData] = useState([]);
const [setCompletions, setSetCompletions] = useState({});

useEffect(() => {
const saved = localStorage.getItem('kanjiCheckedItems');
if (saved) {
setCheckedItems(JSON.parse(saved));
}
const savedCompletions = localStorage.getItem('kanjiSetCompletions');
if (savedCompletions) {
setSetCompletions(JSON.parse(savedCompletions));
}
}, []);

useEffect(() => {
localStorage.setItem('kanjiCheckedItems', JSON.stringify(checkedItems));
}, [checkedItems]);

useEffect(() => {
localStorage.setItem('kanjiSetCompletions', JSON.stringify(setCompletions));
}, [setCompletions]);

const currentLevelInfo = LEVELS.find(l => l.key === level);
const currentTypeInfo = currentLevelInfo ? currentLevelInfo.types.find(t => t.key === type) : null;
const currentData = currentTypeInfo ? currentTypeInfo.data : [];
const categoryKey = `${level}_${type}`;
const buildKey = (id) => `${categoryKey}_item_${id}`;

const handleSelectLevel = (levelKey) => {
setLevel(levelKey);
setType(null);
setScreen('type');
};

const handleSelectType = (typeKey) => {
setType(typeKey);
setSelectedSet(0);
setCurrentIndex(0);
setScreen('menu');
};

const handleSelectSet = (setNumber) => {
setSelectedSet(setNumber);
setCurrentIndex(0);
setScreen('question');
};

const handleReview = () => {
const checked = currentData.filter(item => checkedItems[buildKey(item.id)]);
setReviewData(checked);
setCurrentIndex(0);
setScreen('review');
};

const handleNext = () => {
if (screen === 'question') {
setScreen('answer');
} else if (screen === 'answer') {
const setStartIndex = selectedSet * 20;
const setEndIndex = Math.min((selectedSet + 1) * 20, currentData.length);
const currentSetData = currentData.slice(setStartIndex, setEndIndex);
if (currentIndex + 1 < currentSetData.length) {
setCurrentIndex(currentIndex + 1);
setScreen('question');
} else {
// セット完了：★進捗を記録し、次のセットへ（なければメニューへ）
const completionKey = `${categoryKey}_set_${selectedSet}`;
setSetCompletions(prev => ({
...prev,
[completionKey]: (prev[completionKey] || 0) + 1
}));
const totalSets = Math.ceil(currentData.length / 20);
if (selectedSet + 1 < totalSets) {
setSelectedSet(selectedSet + 1);
setCurrentIndex(0);
setScreen('question');
} else {
setScreen('menu');
setCurrentIndex(0);
}
}
} else if (screen === 'review') {
if (currentIndex + 1 < reviewData.length) {
setCurrentIndex(currentIndex + 1);
} else {
setScreen('menu');
}
}
};

const handlePrev = () => {
if (currentIndex > 0) {
setCurrentIndex(currentIndex - 1);
if (screen !== 'review') {
setScreen('question');
}
}
};

const handleToggleCheck = () => {
let currentItem;
if (screen === 'review') {
currentItem = reviewData[currentIndex];
} else {
const setStartIndex = selectedSet * 20;
const currentSetData = currentData.slice(setStartIndex, Math.min((selectedSet + 1) * 20, currentData.length));
currentItem = currentSetData[currentIndex];
}
if (currentItem) {
const key = buildKey(currentItem.id);
setCheckedItems(prev => ({
...prev,
[key]: !prev[key]
}));
}
};

const handleBackToMenu = () => {
setScreen('menu');
setCurrentIndex(0);
};

const handleBackToType = () => {
setScreen('type');
setType(null);
setSelectedSet(0);
setCurrentIndex(0);
};

const handleBackToLevel = () => {
setScreen('level');
setLevel(null);
setType(null);
setSelectedSet(0);
setCurrentIndex(0);
};

const checkedCount = type
? currentData.filter(item => checkedItems[buildKey(item.id)]).length
: 0;

const setStartIndex = selectedSet * 20;
const currentSetData = currentData.slice(setStartIndex, Math.min((selectedSet + 1) * 20, currentData.length));
const currentItem = screen === 'review' ? reviewData[currentIndex] : currentSetData[currentIndex];
const currentItemKey = currentItem ? buildKey(currentItem.id) : null;
const isChecked = currentItemKey ? !!checkedItems[currentItemKey] : false;

if (screen === 'level') {
return <LevelScreen onSelectLevel={handleSelectLevel} />;
} else if (screen === 'type') {
return <TypeScreen level={currentLevelInfo} onSelectType={handleSelectType} onBackToLevel={handleBackToLevel} />;
} else if (screen === 'menu') {
return <MenuScreen
data={currentData}
categoryLabel={`${currentLevelInfo.label}　${currentTypeInfo.label}`}
categoryKey={categoryKey}
setCompletions={setCompletions}
onSelectSet={handleSelectSet}
onReview={handleReview}
onBackToType={handleBackToType}
checkedCount={checkedCount}
/>;
} else if (screen === 'question') {
return <QuestionScreen
data={currentData}
categoryLabel={`${currentLevelInfo.label}　${currentTypeInfo.label}`}
mode={currentTypeInfo.mode}
setNumber={selectedSet}
currentIndex={currentIndex}
onNext={handleNext}
onPrev={handlePrev}
onBackToMenu={handleBackToMenu}
isChecked={isChecked}
onToggleCheck={handleToggleCheck}
/>;
} else if (screen === 'answer') {
return <AnswerScreen
data={currentData}
categoryLabel={`${currentLevelInfo.label}　${currentTypeInfo.label}`}
mode={currentTypeInfo.mode}
setNumber={selectedSet}
currentIndex={currentIndex}
onNext={handleNext}
onPrev={handlePrev}
onBackToMenu={handleBackToMenu}
isChecked={isChecked}
onToggleCheck={handleToggleCheck}
/>;
} else if (screen === 'review') {
return <ReviewScreen
currentIndex={currentIndex}
reviewData={reviewData}
onNext={handleNext}
onPrev={handlePrev}
onBackToMenu={handleBackToMenu}
checkedItems={checkedItems}
onToggleCheck={handleToggleCheck}
buildKey={buildKey}
mode={currentTypeInfo.mode}
/>;
}
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KanjiLearningApp />);
</script>
</body>
</html>
